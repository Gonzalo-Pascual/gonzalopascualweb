# La VM se administra por su IP de la red privada de Tailscale, no por la
# pública: el puerto 22 está cerrado a Internet en el firewall de Hetzner.
#
# Es una IP estable: Tailscale la asigna al dar de alta el dispositivo y no
# cambia mientras siga registrado. Si alguna vez hubiera que volver a darlo de
# alta, se consulta con 'tailscale ip -4' en la VM o en la consola de Tailscale.
#
# Si Tailscale fallara: activar 'ssh_emergencia' en terraform-hetzner y usar
# temporalmente la IP pública (178.104.42.180).
[web]
vm-portfolio ansible_host=100.98.38.62
