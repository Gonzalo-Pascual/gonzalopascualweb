[defaults]
inventory = inventory.ini
remote_user = root
private_key_file = ~/.ssh/oci_portfolio

[ssh_connection]
# OJO: definir ssh_args SUSTITUYE los valores por defecto de Ansible, no los
# amplía. Antes sólo ponía StrictHostKeyChecking, y con eso se perdía la
# multiplexación: cada tarea abría una conexión SSH nueva desde cero.
#
#  ControlMaster/ControlPersist → una sola conexión reutilizada por todas las
#                                 tareas durante 60 s. Más rápido y menos
#                                 apretones de manos contra el servidor.
#  IdentitiesOnly               → ofrecer SÓLO la clave de private_key_file, no
#                                 todas las del agente SSH. Cada clave rechazada
#                                 cuenta como un intento fallido para fail2ban.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new