# ============================================================================
#  Dependabot: la pieza que hace sostenible el fijado por hash.
#
#  Fijar las acciones y la imagen base por hash da REPRODUCIBILIDAD, pero por
#  sí solo congelaría las dependencias para siempre, lo cual es lo contrario de
#  seguro: en seis meses estarías corriendo software con vulnerabilidades
#  conocidas y parcheadas.
#
#  Dependabot cierra el círculo: vigila los orígenes y abre un pull request
#  cuando aparece una versión nueva, con el hash actualizado y el registro de
#  cambios en la descripción. Así la actualización es una DECISIÓN consciente y
#  revisable, en lugar de algo que ocurre sin que nadie se entere (etiquetas
#  móviles) o que no ocurre nunca (hash sin mantenimiento).
#
#  Es exactamente la carencia que tenía este proyecto: la imagen base llevaba
#  desde junio de 2025 sin actualizarse y nadie lo sabía.
# ============================================================================
version: 2

updates:
  # --- Acciones de GitHub ---------------------------------------------------
  # Vigila los hashes fijados en .github/workflows/. Dependabot entiende el
  # formato "@<hash> # v5" y actualiza ambos, el hash y el comentario.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencias
      - ci

  # --- Imagen base del contenedor -------------------------------------------
  # Vigila el FROM del Dockerfile. Al estar fijado por digest, propondrá el
  # digest nuevo cada vez que se publique un parche de la rama 1.30.
  - package-ecosystem: docker
    directory: /apps/porfolio
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    labels:
      - dependencias
      - contenedor

  # --- Dependencias de la mini-API ------------------------------------------
  # FastAPI, uvicorn y pydantic. Todavía no está desplegada, pero conviene que
  # no acumule deuda mientras se termina.
  - package-ecosystem: pip
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(api)"
    labels:
      - dependencias
      - api
