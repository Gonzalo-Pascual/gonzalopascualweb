# ============================================================================
#  Análisis de seguridad del repositorio: secretos e infraestructura como código.
#
#  Separado del flujo del portfolio a propósito: este analiza TODO el
#  repositorio y debe ejecutarse aunque no se toque la web (por ejemplo al
#  cambiar el Terraform), además de periódicamente, porque las reglas de
#  detección y las bases de datos de vulnerabilidades se actualizan solas.
# ============================================================================
name: Seguridad · Secretos e IaC

on:
  push:
    branches: [main]
  pull_request:
  # Semanal: un análisis que solo corre cuando tocas código nunca detecta una
  # vulnerabilidad publicada DESPUÉS de tu último commit. Y esas son la mayoría.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  #  Búsqueda de secretos filtrados
  # --------------------------------------------------------------------------
  secretos:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # fetch-depth: 0 descarga TODO el historial, no solo el último commit.
      # Es imprescindible: lo que se busca es precisamente un secreto que se
      # commiteó en su día y se borró después. Sigue estando en el historial,
      # y quien haya clonado el repositorio lo conserva. Un secreto que entra
      # en git está comprometido para siempre; la única respuesta correcta es
      # revocarlo y emitir uno nuevo.
      - name: Descargar el código con el historial completo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # gitleaks es gratuito para cuentas personales y repositorios públicos.
      # (Las cuentas de organización requieren una licencia en GITLEAKS_LICENSE.)
      - name: Buscar credenciales con gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  #  Análisis de la infraestructura como código
  # --------------------------------------------------------------------------
  infraestructura:
    name: Terraform y manifiestos de Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Trivy en modo "config" no busca vulnerabilidades de paquetes, sino
      # CONFIGURACIONES INSEGURAS: un puerto abierto de más en Terraform, un
      # contenedor sin límites de memoria, un permiso excesivo. Es el "shift
      # left" de verdad: encontrar el fallo de seguridad en el fichero de texto
      # y no en producción seis meses después.
      #
      # HISTORIA DE ESTE PASO, que es la parte instructiva:
      #
      # Nació sin bloquear, a propósito, porque las reglas de Trivy para
      # Kubernetes son muy exigentes y nadie sabía qué iba a encontrar. Primero
      # se midió. El resultado del primer análisis completo (2026-09-12) fue:
      #
      #   Terraform (Hetzner, Cloudflare, Oracle) .... 0 hallazgos
      #   Manifiestos de Kubernetes .................. 2 MEDIUM
      #   Dockerfile ................................. 1 HIGH
      #   Críticos ................................... 0
      #
      # El HIGH era real y se corrigió (falta de USER explícito en el
      # Dockerfile). Los dos MEDIUM resultaron ser falsos positivos y quedaron
      # documentados con su razón y su fecha de caducidad en .trivyignore.yaml.
      #
      # Con la base limpia, el paso pasa a BLOQUEAR. Es el mismo camino que se
      # siguió con los Pod Security Standards (baseline forzado, restricted
      # avisando) y con DMARC: medir antes de exigir. Exigir sin haber medido
      # produce un pipeline permanentemente rojo que todo el mundo aprende a
      # ignorar, y un aviso que se ignora no protege de nada.

      # Informe completo a la pestaña Security: incluye los MEDIUM y nunca
      # bloquea. Queda histórico y se revisa con calma.
      - name: Analizar configuraciones (informe)
        if: always()
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: MEDIUM,HIGH,CRITICAL
          exit-code: '0'
          format: sarif
          output: trivy-config.sarif

      - name: Publicar hallazgos de configuración
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
        continue-on-error: true

      # LA PUERTA. Va al final para que los informes se suban pase lo que pase.
      #
      # Bloquea ante HIGH y CRITICAL, no ante MEDIUM. El motivo es de
      # estabilidad: Trivy publica reglas nuevas continuamente, y las de nivel
      # MEDIUM suelen ser recomendaciones de estilo. Bloquear ahí convertiría
      # cualquier actualización del catálogo de reglas en una rotura del
      # pipeline sin que hubiera cambiado ni una línea del repositorio. Los
      # MEDIUM siguen apareciendo en el informe de arriba.
      #
      # Para endurecerlo más adelante basta con añadir MEDIUM a esta lista.
      - name: Configuraciones inseguras (BLOQUEANTE)
        if: always()
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: config
          scan-ref: .
          trivyignores: .trivyignore.yaml
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
