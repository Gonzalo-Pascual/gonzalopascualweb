---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    # Mismo criterio que en cert-manager: se FUERZA el perfil "baseline", que
    # rechaza lo que de verdad es peligroso (contenedores privilegiados, red del
    # host, montajes arbitrarios del sistema de ficheros del nodo), y se AVISA
    # sobre "restricted", el perfil más estricto, sin llegar a bloquear.
    #
    # Forzar "restricted" en un componente de terceros puede impedir que
    # arranque tras una actualización del chart. Primero se mide, luego se
    # aprieta: los avisos dirán si ArgoCD ya cumpliría el perfil estricto.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
