---
# PLANTILLA. Este fichero NO se aplica y NO contiene ningún secreto real.
#
# El Secret de verdad se crea con kubectl y nunca entra en git:
#
#   read -rsp "Token de Cloudflare: " CF_API_TOKEN && echo
#   kubectl create secret generic cloudflare-api-token \
#     --namespace cert-manager \
#     --from-literal=api-token="$CF_API_TOKEN"
#   unset CF_API_TOKEN
#
# Por qué no se versiona: un Secret de Kubernetes NO está cifrado, solo
# codificado en base64, que es reversible con un comando. Meterlo en git
# equivale a publicar el token en claro, y el historial de git es para siempre.
#
# En el paso de GitOps (ArgoCD) esto se resolverá con Sealed Secrets o SOPS,
# que sí permiten versionar secretos cifrados de forma segura.
#
# El Secret debe vivir en el namespace 'cert-manager' porque un ClusterIssuer
# busca sus credenciales en el "cluster resource namespace", que por defecto es
# ese, y no en el namespace de la aplicación.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "NUNCA_PONGAS_EL_TOKEN_REAL_AQUI"
