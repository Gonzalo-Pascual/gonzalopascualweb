---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  labels:
    app: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Fijada por DIGEST, no por etiqueta.
          #
          # Una etiqueta como ":v1" es un puntero móvil: nada impide que el
          # contenido detrás de ella cambie sin que este fichero se entere, y
          # el clúster desplegaría algo distinto mientras git sigue diciendo
          # que todo está igual. El digest ES el hash del contenido: si alguien
          # alterase un solo byte de la imagen, el hash no coincidiría y el
          # contenedor se negaría a arrancar.
          #
          # Este digest lo produjo el pipeline .github/workflows/ci-portfolio.yml
          # a partir del commit 45346f7, tras pasar el análisis de Trivy, y está
          # firmado con cosign. Verificable con:
          #
          #   cosign verify ghcr.io/gonzalo-pascual/portfolio@sha256:3f9b3bf1... \
          #     --certificate-identity-regexp 'https://github.com/Gonzalo-Pascual/gonzalopascualweb/.github/workflows/.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          image: ghcr.io/gonzalo-pascual/portfolio@sha256:3f9b3bf12f2a1f3d3991b7af3051ce9bad6c4d55a0665a50d159d05353583e40
          # Con un digest, "si no está, tráela" es seguro: el identificador
          # determina el contenido de forma unívoca, así que la copia en caché
          # nunca puede ser una imagen distinta.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
spec:
  selector:
    app: portfolio
  ports:
    - port: 80
      targetPort: 8080