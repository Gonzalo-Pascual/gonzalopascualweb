---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  labels:
    app: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # Fijada por DIGEST, no por etiqueta.
          #
          # Una etiqueta como ":v1" es un puntero móvil: nada impide que el
          # contenido detrás de ella cambie sin que este fichero se entere, y
          # el clúster desplegaría algo distinto mientras git sigue diciendo
          # que todo está igual. El digest ES el hash del contenido: si alguien
          # alterase un solo byte de la imagen, el hash no coincidiría y el
          # contenedor se negaría a arrancar.
          #
          # Este digest lo produjo el pipeline .github/workflows/ci-portfolio.yml
          # a partir del commit fe6fe39, sobre nginx 1.31-alpine, tras pasar el
          # análisis de Trivy sin vulnerabilidades críticas. Está firmado con
          # cosign y lleva adjuntos su SBOM y su procedencia SLSA.
          #
          # Verificable desde cualquier máquina, sin credenciales:
          #
          #   cosign verify ghcr.io/gonzalo-pascual/portfolio@sha256:e68bbd3f... \
          #     --certificate-identity-regexp 'https://github.com/Gonzalo-Pascual/gonzalopascualweb/.github/workflows/.*' \
          #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
          #
          # Los dos parámetros de identidad no son opcionales: sin ellos sólo
          # comprobarías que ALGUIEN firmó la imagen, no que la firmara este
          # repositorio.
          # Formato 'etiqueta@digest'. Kubernetes usa SIEMPRE el digest cuando
          # están los dos; la etiqueta ':main' existe para que Renovate sepa qué
          # seguir y pueda proponer el digest nuevo tras cada construcción. Sin
          # ella fallaba con "Could not determine new digest".
          image: ghcr.io/gonzalo-pascual/portfolio:main@sha256:619b18e2e0b617b4c382bfc9c2262c527bbe23f5590ef28f7861bc8c3ce81ed9
          # Con un digest, "si no está, tráela" es seguro: el identificador
          # determina el contenido de forma unívoca, así que la copia en caché
          # nunca puede ser una imagen distinta.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio
spec:
  selector:
    app: portfolio
  ports:
    - port: 80
      targetPort: 8080