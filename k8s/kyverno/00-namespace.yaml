---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
  labels:
    # Mismo criterio que en cert-manager y argocd: se fuerza "baseline", que
    # rechaza lo genuinamente peligroso, y se avisa sobre "restricted" sin
    # bloquear, para no impedir que un componente de terceros arranque tras
    # una actualización del chart.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
