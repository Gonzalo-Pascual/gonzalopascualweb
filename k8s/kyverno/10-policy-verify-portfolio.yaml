---
# ============================================================================
#  Política: las imágenes propias deben venir firmadas por este repositorio
#
#  QUÉ IMPIDE, en una frase: que alguien con acceso al clúster despliegue una
#  imagen que no haya salido del pipeline de este repositorio.
#
#  El matiz que la hace interesante: Kyverno no juzga si la imagen es "buena"
#  —eso no lo sabe nadie—, sino su PROCEDENCIA. Y un atacante no puede
#  falsificarla, porque necesitaría que GitHub le emitiera un testimonio OIDC
#  en nombre de Gonzalo-Pascual/gonzalopascualweb.
#
#  ─── POR QUÉ ImageValidatingPolicy Y NO ClusterPolicy ───
#
#  El primer intento usaba 'kyverno.io/v1 ClusterPolicy', que es lo que sale
#  en casi toda la documentación y los ejemplos de internet. Al validarla
#  contra el clúster, Kyverno respondió:
#
#      ClusterPolicy is deprecated and will be removed in a future release;
#      migrate to ValidatingPolicy, MutatingPolicy, GeneratingPolicy or
#      ImageValidatingPolicy (policies.kyverno.io)
#
#  Kyverno 1.19 estrenó tipos de política basados en CEL, y este —específico
#  para verificación de imágenes— es ESTABLE desde esa misma versión. Estrenar
#  el proyecto con una API deprecada habría sido incoherente con todo lo demás.
#
#  ─── EMPIEZA EN MODO AUDITORÍA ───
#
#  validationActions: [Audit] registra las violaciones pero NO bloquea. Mismo
#  camino que los Pod Security Standards, DMARC y el análisis de Trivy: medir
#  antes de exigir.
#
#  Y hay una razón operativa además de la metodológica: con Audit, Kyverno
#  configura su webhook para IGNORAR los fallos. Con Deny pasa a fallar ante un
#  error, y en un clúster de un solo nodo eso significa que un Kyverno caído
#  impediría crear cualquier pod, incluido el suyo propio: un bloqueo mutuo.
#
#  Se pasa a [Deny] solo tras comprobar que el informe da 'pass' sobre la
#  imagen real en producción.
# ============================================================================
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verificar-firma-imagenes-propias
  annotations:
    policies.kyverno.io/title: Verificar la firma de las imágenes propias
    policies.kyverno.io/category: Cadena de suministro
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Exige que toda imagen procedente de ghcr.io/gonzalo-pascual venga firmada
      con cosign mediante OIDC por un flujo de trabajo de este repositorio.
spec:
  # --- A qué peticiones se aplica -------------------------------------------
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]

  # ───────────────────────────────────────────────────────────────────────────
  #  EL ALCANCE ES LO MÁS IMPORTANTE DE TODO ESTE FICHERO.
  #
  #  Solo las imágenes de nuestro registro. Si aquí pusiéramos '*', Traefik,
  #  cert-manager, ArgoCD, CoreDNS y el propio Kyverno necesitarían NUESTRA
  #  firma para arrancar, y el clúster entero se vendría abajo: sus imágenes
  #  están firmadas por sus autores, no por nosotros.
  # ───────────────────────────────────────────────────────────────────────────
  matchImageReferences:
    - glob: "ghcr.io/gonzalo-pascual/*"

  # --- Quién es una firma válida --------------------------------------------
  attestors:
    - name: cosign
      cosign:
        # Verificación SIN CLAVE PÚBLICA.
        #
        # No hay ninguna clave que distribuir ni custodiar. Se comprueba la
        # IDENTIDAD que consta en el certificado efímero que Fulcio emitió
        # durante la firma:
        #
        #   subject → qué flujo de qué repositorio firmó
        #   issuer  → quién acreditó esa identidad (GitHub)
        #
        # Los dos juntos son lo que hace la verificación creíble. Comprobar
        # solo que "está firmada" no vale nada: cualquiera puede firmar.
        keyless:
          identities:
            - subject: "https://github.com/Gonzalo-Pascual/gonzalopascualweb/.github/workflows/*"
              issuer: "https://token.actions.githubusercontent.com"

  # --- Qué se exige ----------------------------------------------------------
  validationConfigurations:
    # Exige que exista firma. Sin esto, una imagen sin ninguna firma pasaría
    # por no haber nada que verificar.
    required: true

    # Comprueba que la imagen se referencia por digest y no solo por etiqueta.
    # Refuerza desde el clúster lo que ya hace el manifiesto: se despliega un
    # contenido concreto, no un puntero que alguien pueda mover.
    verifyDigest: true

    # DEBE ser false mientras la acción sea Audit: mutar es un cambio, y
    # contradice el "solo observar". Kyverno rechaza la política si no lo es.
    # Se pondrá a true al pasar a [Deny], y entonces reescribirá a su digest
    # cualquier imagen desplegada por etiqueta.
    mutateDigest: false

  # --- La comprobación en sí -------------------------------------------------
  validations:
    - expression: >-
        images.containers.map(image,
        verifyImageSignatures(image, [attestors.cosign])).all(e, e > 0)
      message: >-
        La imagen no tiene una firma valida emitida por un flujo de
        Gonzalo-Pascual/gonzalopascualweb a traves de GitHub Actions.

  # Audit = registra y no bloquea. Ver la explicación del encabezado.
  validationActions: [Audit]

  evaluation:
    background:
      # Activado: permite que el controlador de informes evalúe también los
      # pods que YA están corriendo, sin tener que recrearlos. Es lo que hace
      # útil la fase de auditoría.
      enabled: true
