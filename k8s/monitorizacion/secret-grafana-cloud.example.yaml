# ============================================================================
#  Token de Grafana Cloud — EJEMPLO, no aplicar tal cual.
#
#  El Secret real NO se versiona. Se crea a mano, leyendo el token sin que
#  aparezca en pantalla ni quede en el historial de la shell:
#
#    read -rs GC_TOKEN && printf '%s' "$GC_TOKEN" | \
#      kubectl -n monitorizacion create secret generic grafana-cloud \
#      --from-file=token=/dev/stdin && unset GC_TOKEN
#
#  (--from-file=/dev/stdin en lugar de --from-literal: así el token tampoco
#  aparece en la lista de procesos mientras kubectl se ejecuta.)
#
#  PERMISOS DEL TOKEN (Access Policy en grafana.com), los mínimos:
#    · metrics:write
#    · logs:write
#  Nada de lectura: si este token se filtrara, quien lo tuviera podría ENVIAR
#  datos falsos a la cuenta, pero no LEER nada de lo que hay en ella.
# ============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-cloud
  namespace: monitorizacion
type: Opaque
stringData:
  token: "NUNCA_PONGAS_EL_TOKEN_REAL_AQUI"
