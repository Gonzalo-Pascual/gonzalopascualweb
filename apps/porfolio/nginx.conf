server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # No anunciar la versión de nginx en la cabecera Server ni en las páginas
    # de error. No es una defensa en sí misma, pero no tiene sentido regalarle
    # a un escáner automático la lista exacta de vulnerabilidades que probar.
    server_tokens off;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # form-action ya no incluye 'self': el único formulario envía a Formspree,
    # y la API de contacto propia se descartó. Permitir 'self' sería abrir una
    # puerta a un destino que no existe.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action https://formspree.io" always;

    # Una URL que no existe devuelve un 404 DE VERDAD.
    #
    # Antes la regla terminaba en '/index.html': cualquier ruta inventada
    # devolvía la portada con un 200. Es lo que se llama un "soft 404". Los
    # buscadores lo penalizan (indexan contenido duplicado en URLs basura), y
    # confunde a cualquier herramienta de monitorización o de seguridad que
    # mire el código de estado: un escáner que prueba /wp-admin o /.env
    # recibía "200 OK" y no podía distinguir lo que existe de lo que no.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    # 'internal': la página de error sólo se sirve como respuesta a un 404, no
    # visitando /404.html directamente (que daría un 200 engañoso).
    location = /404.html {
        internal;
    }
}
