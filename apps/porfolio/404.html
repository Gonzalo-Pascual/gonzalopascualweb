<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Una página de error no debe aparecer en los buscadores. -->
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#252734">
    <title>Página no encontrada · Gonzalo Pascual</title>
    <!--
        Rutas ABSOLUTAS (empiezan por /) a propósito: esta página se sirve para
        cualquier URL inexistente, también para /a/b/c. Con rutas relativas el
        navegador buscaría la fuente en /a/b/vendor/... y no la encontraría.
    -->
    <link rel="icon" href="/imagenes/gblanco.png">
    <style>
        @font-face {
            font-family: 'Inter';
            font-weight: 100 900;
            font-display: swap;
            src: url('/vendor/fonts/inter-latin-wght-normal.woff2') format('woff2');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            padding: 1rem;
            text-align: center;
            font-family: 'Inter', sans-serif;
            background: #252734;
            color: #F1F3FF;
        }

        h1 {
            font-size: clamp(4rem, 15vw, 8rem);
            color: #58C39D;
        }

        a {
            color: #252734;
            background: #58C39D;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <h1>404</h1>
    <p>La página que buscas no existe.</p>
    <a href="/">Volver al inicio</a>
</body>

</html>
